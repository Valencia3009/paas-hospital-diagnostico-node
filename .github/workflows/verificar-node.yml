
name: Verificar sistema Node.js - Hospital de Diagnostico

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  verificar-node:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo del repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      - name: Verificar sintaxis del servidor
        run: node --check index.js

      - name: Verificar sintaxis de la conexion
        run: node --check database.js

      - name: Verificar sintaxis del frontend
        run: node --check public/app.js
